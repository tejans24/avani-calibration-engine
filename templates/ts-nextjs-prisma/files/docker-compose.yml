services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_dev
    ports:
      # Host port is per-app (derived from the app name at stamp time) so two
      # generated apps can run side by side without colliding on 5432.
      - '{{DB_PORT}}:5432'
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker
      # and declare the volume at /var/lib/postgresql. Mounting the pre-18 path
      # (/var/lib/postgresql/data) still starts, but nothing persists.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app_dev']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
