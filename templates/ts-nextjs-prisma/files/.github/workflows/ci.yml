# The CI ladder: fail cheap first. checks (typecheck/lint/unit) -> integration
# (real postgres via testcontainers) -> e2e (built app + migrated db).
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  AVANI_STAGE: dev

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  integration:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:integration

  e2e:
    needs: integration
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d app_dev"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_dev?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:migrate:deploy
      - run: npm run db:init
      - run: npm run db:seed:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
